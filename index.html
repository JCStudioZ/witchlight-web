<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Witchlight</title>
		<!--
		Witchlight's page (the export's custom HTML shell; Godot's own, plus its
		loading screen): the night (a 16:9 box as big as fits, centred, as the
		game's title lays out), twinkling stars, the logo (the boot splash,
		index.png: tools/make_splash.py), and Luna flying along a trail of
		sparkles as the game comes in. When it's in, the screen fades into the
		title's opening, which starts from this same night and logo.
		-->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #141024;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	--bw: min(100vw, 177.78vh);   /* the 16:9 box */
	--bh: min(56.25vw, 100vh);
	position: absolute;
	inset: 0;
	overflow: hidden;
	visibility: hidden;
	background: radial-gradient(ellipse 80% 80% at 50% 38%, #2c2158 0%, #1b1538 45%, #141024 100%);
	transition: opacity 0.45s ease;
}

#status.wl-done {
	opacity: 0;
	pointer-events: none;
}

#status-splash {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: contain;
}

#status-splash.show-image--false {
	display: none;
}

.wl-star {
	position: absolute;
	border-radius: 50%;
	background: #fff3d6;
	opacity: 0.15;
	animation: wl-twinkle 2.6s ease-in-out infinite;
}

#status-progress {
	position: absolute;
	left: 50%;
	top: calc(50vh + var(--bh) * 0.25);
	width: calc(var(--bw) * 0.34);
	height: 3px;
	transform: translateX(-50%);
	display: none;
	background: repeating-linear-gradient(90deg, rgba(203, 189, 240, 0.28) 0 3px, transparent 3px 9px);
}

#wl-trail {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 0%;
	background: repeating-linear-gradient(90deg, #ffd27a 0 3px, transparent 3px 9px);
	filter: drop-shadow(0 0 3px rgba(255, 210, 122, 0.9));
	transition: width 0.25s linear;
}

#wl-witch {
	position: absolute;
	left: 0%;
	bottom: 0;
	height: calc(var(--bh) * 0.14);
	transform: translate(-58%, 18%);
	transition: left 0.25s linear;
	animation: wl-bob 1.4s ease-in-out infinite;
}

#wl-witch div {
	height: 100%;
	background-repeat: no-repeat;
}

#wl-words {
	position: absolute;
	left: 0;
	right: 0;
	top: calc(100% + var(--bh) * 0.03);
	text-align: center;
	white-space: nowrap;
	color: #cbbdf0;
	font: 600 max(12px, calc(var(--bh) * 0.026))/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif;
	letter-spacing: 0.06em;
	text-shadow: 0 1px 0 #0d0818;
}

#status-notice {
	display: none;
	position: absolute;
	left: 50%;
	top: calc(50vh + var(--bh) * 0.22);
	transform: translateX(-50%);
	width: min(80vw, 520px);
	box-sizing: border-box;
	background-color: #2a1650;
	border-radius: 0.6rem;
	border: 1px solid #ffd27a;
	color: #f1ecff;
	font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
	line-height: 1.4;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

@keyframes wl-twinkle {
	0%, 100% { opacity: 0.12; }
	50% { opacity: 1; }
}

@keyframes wl-bob {
	0%, 100% { margin-bottom: 0; }
	50% { margin-bottom: calc(var(--bh) * 0.008); }
}
		</style>

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Witchlight">
<style>
#wl-turn{display:none;position:fixed;inset:0;z-index:1000;background:#141024;color:#f1ecff;font:600 20px/1.4 system-ui,-apple-system,sans-serif;text-align:center;align-items:center;justify-content:center;flex-direction:column;padding:28px;box-sizing:border-box}
#wl-turn .phone{width:54px;height:92px;border:4px solid #ffd27a;border-radius:12px;margin:0 auto 26px;animation:wl-turn 2.4s ease-in-out infinite}
#wl-turn small{display:block;margin-top:16px;color:#a99cc8;font-weight:400;font-size:15px}
@keyframes wl-turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#wl-turn{display:flex}}
</style>
<script>
/* Witchlight on a phone's browser: held upright, a card asks to turn it
   sideways (the game is laid out for landscape); the first tap asks the
   browser for full screen and locks it sideways (Android; an iPhone's Safari
   allows neither, so it tells how to add the game to the Home Screen, where
   it opens full screen). */
document.addEventListener("DOMContentLoaded", function () {
	var ios = /iPhone|iPod/.test(navigator.userAgent);
	var app = navigator.standalone || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches;
	var d = document.createElement("div");
	d.id = "wl-turn";
	d.innerHTML = '<div class="phone"></div>Turn your phone sideways to play' +
		(ios && !app ? "<small>For full screen: tap Share, then Add to Home Screen, and open Witchlight from there.</small>" : "");
	document.body.appendChild(d);
});
(function () {
	if (!matchMedia("(pointer:coarse)").matches) return;
	var asked = false;
	window.addEventListener("pointerup", function () {
		var el = document.documentElement;
		if (asked || document.fullscreenElement || !el.requestFullscreen) return;
		asked = true;
		el.requestFullscreen({ navigationUI: "hide" }).then(function () {
			if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
		}).catch(function () { asked = false; });
	}, true);
})();
</script>

const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const trail = document.getElementById('wl-trail');
	const witch = document.getElementById('wl-witch');
	const words = document.getElementById('wl-words');

	// The stars: scattered over the top of the sky, each on its own beat.
	for (let k = 0; k < 48; k++) {
		const s = document.createElement('div');
		const r = 1 + Math.random() * 2;
		s.className = 'wl-star';
		s.style.left = (Math.random() * 100) + '%';
		s.style.top = (Math.random() * 62) + '%';
		s.style.width = s.style.height = r + 'px';
		s.style.animationDelay = (-Math.random() * 3) + 's';
		s.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
		statusOverlay.insertBefore(s, statusOverlay.firstChild);
	}

	// Her flying loop, a strip of frames, at 10 frames a second.
	if (WITCH_STRIP.frames > 0) {
		const n = WITCH_STRIP.frames;
		const f = witch.firstChild;
		witch.style.aspectRatio = WITCH_STRIP.w + ' / ' + WITCH_STRIP.h;
		f.style.backgroundImage = 'url("' + WITCH_STRIP.png + '")';
		f.style.backgroundSize = (n * 100) + '% 100%';
		f.animate([{ backgroundPosition: '0% 0' }, { backgroundPosition: (100 * n / (n - 1)) + '% 0' }],
			{ duration: n * 100, iterations: Infinity, easing: 'steps(' + n + ')' });
	} else {
		witch.style.display = 'none';
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {   // fades into the title's opening (the same night and logo)
			initializing = false;
			statusOverlay.classList.add('wl-done');
			setTimeout(() => statusOverlay.remove(), 500);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round(100 * current / total));
					trail.style.width = pct + '%';
					witch.style.left = pct + '%';
					words.textContent = 'Brewing the night sky… ' + pct + '%';
				} else {
					words.textContent = 'Brewing the night sky…';
				}
			},
		}).then(() => {
			words.textContent = 'Here she comes!';
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
